<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar · Almoxarifado</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="pagina-auth">
    <div class="cartao-auth">
      <div class="tag">Estoque &middot; Depósito</div>
      <h2>Almoxarifado</h2>
      <p class="subtitulo">Entre com seu e-mail e senha para continuar.</p>

      {% with mensagens = get_flashed_messages(with_categories=true) %}
        {% if mensagens %}
          {% for categoria, mensagem in mensagens %}
            <div class="flash flash-{{ categoria }}">{{ mensagem }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="post">
        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" required autofocus>
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" required>
        </div>
        <button type="submit" class="btn btn-ambar">Entrar</button>
      </form>
    </div>
  </div>
</body>
</html>
